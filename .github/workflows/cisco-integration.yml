name: Cisco integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cisco-integration
  cancel-in-progress: false

jobs:
  token-authentication:
    name: Live Cisco OAuth authentication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cisco-integration

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Authenticate to Cisco OAuth
        env:
          RUN_CISCO_LIVE_TESTS: "1"
          CISCO_CLIENT_ID: ${{ secrets.CISCO_CLIENT_ID }}
          CISCO_CLIENT_SECRET: ${{ secrets.CISCO_CLIENT_SECRET }}
        run: python -m unittest -v tests.test_live_cisco_token
